# LEMUR's current AstroCLIP preprocessing (scripts/astroclip_xray_similarity.py),
# applied unchanged to LEMUR and the mocks: a fixed 512 native-pixel (4.2') field
# around the X-ray centre, plain area mean onto a 3.936" (64 px) grid,
# zero-padded Gaussian smoothing (sigma 1.5 px), per-image 5-99.7 percentile
# asinh stretch over all positive pixels, resized to 144 px at embedding.

name: baseline
band: broad
field: {native_pixels: 512}
grid: 64
model_size: 144
cosmology: Planck15
center: xray_peak        # LEMUR: catalog X-ray centre; mocks: the same peak finder
weighting: none          # plain area mean of F, uncovered pixels as 0
smoothing: {sigma_pix: 1.5, masked: false}
coverage:
  pixel_min: 0.0         # no pixel mask
  object_min: 0.95       # only flags objects; the baseline used every image
allow_upsampling: true
intensity: {mode: morphology, lower_pct: 5.0, upper_pct: 99.7, asinh_a: 0.08}

lemur: {clusters_only: true}
mocks:
  sims: [TNG300-1, TNG-Cluster]
  redshifts: [0.05, 0.1, 0.2]
  exposures_ks: [20, 100]
  projections: [x, y, z]
